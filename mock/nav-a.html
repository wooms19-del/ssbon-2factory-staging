<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 A · 아이콘 레일 + 서브패널</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");
:root{--ink:#101A24;--ink2:#18242F;--steel:#5A6B79;--steel2:#8798A5;--line:#DCE3E9;
--tile:#EDF1F4;--sf:#fff;--sig:#0F6E8C;--live:#1F8A4C;
--sans:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--tile);
display:grid;grid-template-columns:72px 212px 1fr;min-height:100vh}
body.folded{grid-template-columns:72px 0 1fr}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 아이콘 레일 */
.rail{background:var(--ink);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:2px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--sig);color:#fff;display:grid;
place-items:center;font-weight:800;font-size:13px;margin-bottom:14px}
.rbtn{width:56px;padding:9px 0;border:0;background:transparent;color:rgba(255,255,255,.6);
border-radius:10px;cursor:pointer;display:grid;justify-items:center;gap:4px;font-size:10.5px;font-family:inherit}
.rbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
.rbtn:hover{background:rgba(255,255,255,.07);color:#fff}
.rbtn.on{background:rgba(255,255,255,.13);color:#fff;font-weight:600}

/* 서브패널 */
.sub{background:var(--ink2);color:#fff;overflow:hidden;display:flex;flex-direction:column}
.sub-hd{padding:18px 18px 10px;display:flex;align-items:center;gap:8px}
.sub-hd b{font-size:15px;letter-spacing:-.01em}
.fold{margin-left:auto;width:24px;height:24px;border:0;border-radius:6px;background:transparent;
color:var(--steel2);cursor:pointer}
.fold:hover{background:rgba(255,255,255,.1);color:#fff}
.flow{list-style:none;margin:0;padding:4px 10px;position:relative}
.flow::before{content:"";position:absolute;left:25px;top:20px;bottom:52px;width:2px;background:rgba(255,255,255,.16)}
.flow li{position:relative}
.node{position:absolute;left:21px;top:50%;margin-top:-5px;width:10px;height:10px;border-radius:50%;
background:var(--ink2);border:2px solid rgba(255,255,255,.4);z-index:1}
.flow a{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 34px;border-radius:8px;
color:rgba(255,255,255,.8);text-decoration:none}
.flow a:hover{background:rgba(255,255,255,.07);color:#fff}
.flow li.on a{background:rgba(255,255,255,.13);color:#fff;font-weight:600}
.flow li.on .node{background:var(--sig);border-color:var(--sig)}
.seq{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--steel2)}
.branch{margin:2px 10px 0;padding:9px 10px 9px 34px;position:relative;border-radius:8px;
color:rgba(255,255,255,.7);font-size:13px}
.branch::before{content:"";position:absolute;left:25px;top:-6px;width:12px;height:22px;
border-left:2px solid rgba(255,255,255,.16);border-bottom:2px solid rgba(255,255,255,.16);
border-bottom-left-radius:7px}
.branch:hover{background:rgba(255,255,255,.07);color:#fff;cursor:pointer}
.sub-ft{margin-top:auto;padding:12px 18px;font-family:var(--mono);font-size:10.5px;color:var(--steel2)}

/* 본문 */
.top{height:58px;background:var(--sf);border-bottom:1px solid var(--line);display:flex;
align-items:center;padding:0 20px;gap:10px}
.top h1{font-size:16px;margin:0;font-weight:700}
.chip{margin-left:auto;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;
border:1px solid var(--line);border-radius:999px}
.av{width:24px;height:24px;border-radius:50%;background:var(--sig);color:#fff;display:grid;
place-items:center;font-size:11px;font-weight:700}
.pad{padding:20px}
.ph{background:var(--sf);border:1px dashed var(--line);border-radius:10px;padding:26px;color:var(--steel)}
</style></head><body>

<nav class="rail">
  <div class="logo">2F</div>
  <button class="rbtn"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>일정표</button>
  <button class="rbtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>출퇴근</button>
  <button class="rbtn on"><svg viewBox="0 0 24 24"><path d="M4 4v16M20 4v16M8 12h9M13 8l4 4-4 4"/></svg>입력</button>
  <button class="rbtn"><svg viewBox="0 0 24 24"><path d="M4 20V9M10 20V4M16 20v-8M22 20H2"/></svg>분석</button>
  <button class="rbtn"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>실적</button>
  <button class="rbtn"><svg viewBox="0 0 24 24"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>AI</button>
</nav>

<aside class="sub">
  <div class="sub-hd"><b>입력</b>
    <button class="fold" onclick="document.body.classList.toggle('folded')">‹</button></div>
  <ul class="flow">
    <li><span class="node"></span><a href="#">해동기<span class="seq">01</span></a></li>
    <li><span class="node"></span><a href="#">방혈<span class="seq">02</span></a></li>
    <li><span class="node"></span><a href="#">전처리<span class="seq">03</span></a></li>
    <li><span class="node"></span><a href="#">자숙<span class="seq">04</span></a></li>
    <li><span class="node"></span><a href="#">파쇄<span class="seq">05</span></a></li>
    <li class="on"><span class="node"></span><a href="#">내포장<span class="seq">06</span></a></li>
    <li><span class="node"></span><a href="#">레토르트<span class="seq">07</span></a></li>
    <li><span class="node"></span><a href="#">외포장<span class="seq">08</span></a></li>
  </ul>
  <div class="branch">소스 <span style="color:var(--steel2);font-size:11px">→ 내포장 투입</span></div>
  <div class="sub-ft">v0.1.2-shell</div>
</aside>

<main>
  <header class="top"><h1>내포장</h1>
    <div class="chip"><span class="av">박</span><b>박정환</b><span style="color:var(--steel)">관리자</span></div>
  </header>
  <div class="pad"><div class="ph">본문 영역. 서브패널은 ‹ 버튼으로 접힙니다.</div></div>
</main>
</body></html>
