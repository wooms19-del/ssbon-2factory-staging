<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>순수본 2공장 생산관리</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<section class="login" id="login">
  <aside class="login-aside">
    <div>
      <div class="eyebrow">Ssbon Plant 2</div>
      <div class="login-brand">순수본 2공장 생산관리</div>
    </div>
    <div class="login-flow">
      <h2>공정 순서</h2>
      <ul>
        <li>해동기</li><li>방혈</li><li>전처리</li><li>자숙</li><li>파쇄</li>
        <li class="tr">소스</li>
        <li>내포장</li><li>레토르트</li><li>외포장</li>
      </ul>
    </div>
    <div class="login-foot">공용 기기에서는 로그인 유지를 켜지 마세요.</div>
  </aside>
  <main class="login-main">
    <div class="login-card">
      <h1>로그인</h1>
      <p class="lead">공장에서 받은 아이디로 들어갑니다.</p>
      <form id="loginForm" novalidate>
        <div class="field"><label for="loginId">아이디</label>
          <input id="loginId" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
        <div class="field"><label for="loginPw">비밀번호</label>
          <input id="loginPw" type="password" autocomplete="current-password"></div>
        <label class="remember"><input id="loginKeep" type="checkbox"> 이 기기에서 로그인 유지</label>
        <button class="btn btn-primary" type="submit">로그인</button>
      </form>
      <button class="btn btn-ghost" id="reviewBtn" type="button">인증 연결 전 · 화면만 둘러보기</button>
      <div class="notice" id="loginMsg" hidden></div>
    </div>
  </main>
</section>

<div class="shell" id="shell" hidden>
  <nav class="rail" id="rail" aria-label="주 메뉴">
    <div class="logo">2F</div>
  </nav>

  <aside class="sub">
    <div class="sub-hd">
      <div>
        <b id="subTitle"></b>
        <div class="d" id="subDesc"></div>
      </div>
      <button class="fold" id="foldBtn" type="button" aria-label="메뉴 접기">‹</button>
    </div>
    <ul class="sub-list" id="subList"></ul>
    <div class="sub-ft" id="version"></div>
  </aside>

  <div>
    <header class="top">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="메뉴 열기">☰</button>
      <span class="crumb" id="crumb"></span>
      <h1 id="pageTitle"></h1>
      <button class="chip" id="userBtn" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="av" id="userInitial"></span>
        <span id="userName"></span>
        <span class="crumb" id="userRole"></span>
      </button>
      <div class="umenu" id="userMenu" hidden>
        <div class="who"><b id="menuWho"></b><br><span id="menuRole"></span></div>
        <button id="menuPw" type="button">비밀번호 변경</button>
        <button id="menuOut" class="danger" type="button">로그아웃</button>
      </div>
    </header>

    <div class="content">
      <div class="notice banner" id="reviewBanner" hidden>
        <b>검토 모드</b> — 인증을 거치지 않은 상태입니다. 계정 저장소를 연결하면 사라집니다.
      </div>
      <div id="content"></div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/nav.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/daily.js"></script>
<script src="js/monthly.js"></script>
<script src="js/plan.js"></script>
<script src="js/views2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
